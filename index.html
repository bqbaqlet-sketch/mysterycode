<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Хранилище ТИКК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#05070c;
    --bg-panel:#10141d;
    --steel:#232b3a;
    --steel-light:#3a4457;
    --brass:#c9a227;
    --brass-dim:#7a6420;
    --orange:#ff6a13;
    --orange-dim:#a3450c;
    --blue:#2547e8;
    --blue-dim:#16297a;
    --text:#eeeae0;
    --text-dim:#7c8494;
    --danger:#ff4d4d;
    --ok:#3ddc84;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg-void);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    overflow-x:hidden;
  }

  body{
    background:
      radial-gradient(ellipse 900px 600px at 50% 20%, rgba(37,71,232,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 50% 90%, rgba(255,106,19,0.07), transparent 60%),
      var(--bg-void);
  }

  h1,h2,h3{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    margin:0;
    letter-spacing:0.02em;
  }

  /* ---------- scanline / grain overlay, applies everywhere ---------- */
  .scanlines{
    pointer-events:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
    opacity:0.5;
  }

  /* =====================================================
     SPLASH SCREEN
     ===================================================== */
  #splash{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:var(--bg-void);
    transition:opacity 1s ease, filter 1s ease;
  }

  #splash.fade-out{
    opacity:0;
    filter:blur(6px);
    pointer-events:none;
  }

  .splash-emblem-wrap{
    position:relative;
    width:190px;
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .splash-emblem-wrap::before{
    content:'';
    position:absolute;
    inset:-30px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,106,19,0.35), rgba(37,71,232,0.15) 55%, transparent 75%);
    filter:blur(14px);
    animation:pulse-glow 2.6s ease-in-out infinite;
  }

  @keyframes pulse-glow{
    0%,100%{ opacity:0.55; transform:scale(0.94); }
    50%{ opacity:1; transform:scale(1.05); }
  }

  .splash-emblem{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:50%;
    position:relative;
    z-index:2;
    filter:drop-shadow(0 0 18px rgba(255,106,19,0.35));
    animation:emblem-breathe 3.2s ease-in-out infinite;
  }

  @keyframes emblem-breathe{
    0%,100%{ transform:scale(1) rotate(0deg); }
    50%{ transform:scale(1.03) rotate(0.6deg); }
  }

  .splash-ring{
    position:absolute;
    inset:-16px;
    border-radius:50%;
    border:1px solid var(--steel-light);
    border-top-color:var(--orange);
    border-right-color:var(--blue);
    animation:ring-spin 6s linear infinite;
    opacity:0.7;
  }

  @keyframes ring-spin{
    to{ transform:rotate(360deg); }
  }

  .splash-title{
    margin-top:38px;
    font-size:13px;
    letter-spacing:0.35em;
    color:var(--text-dim);
    text-transform:uppercase;
    min-height:18px;
  }

  .splash-title .cursor{
    display:inline-block;
    width:7px;
    height:12px;
    background:var(--orange);
    margin-left:4px;
    vertical-align:-1px;
    animation:blink 1s step-end infinite;
  }

  @keyframes blink{
    50%{ opacity:0; }
  }

  .splash-bar-track{
    margin-top:26px;
    width:220px;
    height:3px;
    background:var(--steel);
    position:relative;
    overflow:hidden;
  }

  .splash-bar-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background:linear-gradient(90deg, var(--blue), var(--orange));
    transition:width 0.3s linear;
  }

  .splash-pct{
    margin-top:10px;
    font-size:11px;
    color:var(--steel-light);
    letter-spacing:0.15em;
  }

  /* =====================================================
     MAIN SITE
     ===================================================== */
  #site{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 80px;
    opacity:0;
    transform:translateY(10px);
    transition:opacity 0.9s ease, transform 0.9s ease;
  }

  #site.visible{
    opacity:1;
    transform:translateY(0);
  }

  .top-emblem{
    width:56px;
    height:56px;
    border-radius:50%;
    object-fit:contain;
    opacity:0.9;
  }

  .site-heading{
    margin-top:18px;
    text-align:center;
  }

  .site-heading h1{
    font-size:clamp(28px, 5vw, 38px);
    color:var(--text);
  }

  .site-heading p{
    margin-top:10px;
    font-size:13px;
    color:var(--text-dim);
    max-width:360px;
    line-height:1.6;
    letter-spacing:0.02em;
  }

  /* ---------- vault visual ---------- */
  .vault-wrap{
    margin:38px 0 30px;
    position:relative;
    width:220px;
    height:220px;
  }

  .vault-wrap svg{
    width:100%;
    height:100%;
    display:block;
  }

  .bolt{ transition:transform 0.7s cubic-bezier(.2,.8,.2,1); }
  .vault-wrap.unlocked .bolt-n{ transform:translateY(-14px); }
  .vault-wrap.unlocked .bolt-s{ transform:translateY(14px); }
  .vault-wrap.unlocked .bolt-e{ transform:translateX(14px); }
  .vault-wrap.unlocked .bolt-w{ transform:translateX(-14px); }

  .dial-group{
    transform-origin:110px 110px;
    transition:transform 1.1s cubic-bezier(.3,.9,.2,1);
  }

  .vault-wrap.unlocked .dial-group{
    transform:rotate(220deg);
  }

  .vault-wrap.spinning .dial-group{
    animation:dial-idle 7s linear infinite;
  }

  @keyframes dial-idle{
    0%{ transform:rotate(0deg); }
    100%{ transform:rotate(360deg); }
  }

  .vault-glow{
    opacity:0;
    transition:opacity 0.8s ease;
  }

  .vault-wrap.unlocked .vault-glow{
    opacity:1;
  }

  /* ---------- form panel ---------- */
  .panel{
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, var(--bg-panel), #0b0e15);
    border:1px solid var(--steel);
    padding:30px 26px 26px;
    position:relative;
  }

  .rivet{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #6b6f7a, #1a1d24 70%);
    box-shadow:0 0 0 1px rgba(0,0,0,0.5);
  }
  .rivet.tl{ top:10px; left:10px; }
  .rivet.tr{ top:10px; right:10px; }
  .rivet.bl{ bottom:10px; left:10px; }
  .rivet.br{ bottom:10px; right:10px; }

  .field{
    margin-bottom:20px;
  }

  .field label{
    display:block;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--text-dim);
    margin-bottom:8px;
  }

  .field input{
    width:100%;
    background:#0a0d13;
    border:1px solid var(--steel);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    padding:12px 13px;
    outline:none;
    transition:border-color 0.25s ease, box-shadow 0.25s ease;
    letter-spacing:0.03em;
  }

  .field input::placeholder{
    color:#454e60;
  }

  .field input:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,106,19,0.12);
  }

  #code-input{
    letter-spacing:0.16em;
    font-size:15px;
  }

  .code-counter{
    margin-top:6px;
    font-size:10px;
    color:var(--steel-light);
    text-align:right;
    letter-spacing:0.08em;
  }

  .code-counter.full{
    color:var(--ok);
  }

  .submit-btn{
    width:100%;
    margin-top:8px;
    padding:14px;
    background:transparent;
    border:1px solid var(--orange-dim);
    color:var(--orange);
    font-family:'Oswald', sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }

  .submit-btn:hover:not(:disabled){
    border-color:var(--orange);
    background:rgba(255,106,19,0.08);
  }

  .submit-btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }

  .status-msg{
    margin-top:16px;
    font-size:12px;
    line-height:1.6;
    letter-spacing:0.02em;
    min-height:18px;
    text-align:center;
  }

  .status-msg.error{ color:var(--danger); }
  .status-msg.ok{ color:var(--ok); }
  .status-msg.pending{ color:var(--text-dim); }

  /* ---------- hint ---------- */
  .hint-zone{
    margin-top:34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:400px;
    width:100%;
  }

  .hint-btn{
    background:transparent;
    border:1px solid var(--steel);
    color:var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    padding:10px 22px;
    cursor:pointer;
    transition:border-color 0.25s ease, color 0.25s ease;
  }

  .hint-btn:hover{
    border-color:var(--blue);
    color:var(--text);
  }

  .hint-panel{
    margin-top:14px;
    width:100%;
    border-left:2px solid var(--blue-dim);
    padding:12px 16px;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.7;
    background:rgba(37,71,232,0.05);
    display:none;
    opacity:0;
    transition:opacity 0.4s ease;
  }

  .hint-panel.shown{
    display:block;
  }

  .hint-panel.visible{
    opacity:1;
  }

  .footer-note{
    margin-top:60px;
    font-size:10px;
    color:#3a4051;
    letter-spacing:0.1em;
    text-align:center;
  }

  @media (max-width:420px){
    .panel{ padding:24px 18px 20px; }
    .vault-wrap{ width:180px; height:180px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>

        <input type="text" id="f-room" name="room" placeholder="Где вы сейчас" autocomplete="off">
      </div>

      <div class="field">
        <label for="code-input">Код доступа · 20 цифр</label>
        <input type="text" id="code-input" name="code" placeholder="00000 00000 00000 00000" inputmode="numeric" autocomplete="off">
        <div class="code-counter" id="code-counter">0 / 20</div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Открыть сейф</button>

      <div class="status-msg" id="status-msg"></div>
    </form>
  </div>

  <div class="hint-zone">
    <button class="hint-btn" id="hint-btn">Подсказка</button>
    <div class="hint-panel" id="hint-panel"></div>
  </div>

  <div class="footer-note">ТИКК · доступ фиксируется</div>
</div>

<script>
/* =====================================================================
   НАСТРОЙКИ — редактируйте здесь
   ===================================================================== */
const CONFIG = {
  // Токен вашего Telegram-бота (получен у @BotFather)
  BOT_TOKEN: "8196479742:AAHJdTEbL8vd0KhuWW5Fw3K5JaVihSr3rIw",

  // Chat ID, куда будут приходить заявки
  CHAT_ID: "5958599418",

  // Длительность заставки с эмблемой перед входом на сайт, в миллисекундах
  SPLASH_DURATION_MS: 9000,

  // Сколько цифр должно быть в коде
  CODE_LENGTH: 20,

  // ---------------------------------------------------------------------
  // ПОДСКАЗКИ: добавляйте новые строки в этот массив в любое время.
  // Кнопка "Подсказка" показывает их по очереди при каждом нажатии,
  // затем возвращается к первой. Порядок — сверху вниз.
  // ---------------------------------------------------------------------
  HINTS: [
    "Внимательно смотри свой каждый шаг"
    // "Вторая подсказка появится здесь",
    // "Третья подсказка появится здесь",
  ]
};

/* =====================================================================
   СПЛЭШ-ЭКРАН
   ===================================================================== */
(function initSplash(){
  const bootLines = [
    "ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ",
    "ПРОВЕРКА ДОСТУПА",
    "СИНХРОНИЗАЦИЯ ХРАНИЛИЩА",
    "ГОТОВО"
  ];

  const splash = document.getElementById('splash');
  const site = document.getElementById('site');
  const bar = document.getElementById('splash-bar');
  const pct = document.getElementById('splash-pct');
  const textEl = document.getElementById('splash-text');

  const duration = CONFIG.SPLASH_DURATION_MS;
  const start = performance.now();
  let lineIndex = -1;
  let lastLineSwitch = -1;

  function frame(now){
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const percent = Math.floor(progress * 100);

    bar.style.width = (progress * 100) + '%';
    pct.textContent = percent + '%';

    const segment = Math.floor(progress * bootLines.length);
    if (segment !== lastLineSwitch && segment < bootLines.length){
      lastLineSwitch = segment;
      textEl.textContent = bootLines[segment];
    }

    if (progress < 1){
      requestAnimationFrame(frame);
    } else {
      finishSplash();
    }
  }

  function finishSplash(){
    splash.classList.add('fade-out');
    setTimeout(() => {
      splash.style.display = 'none';
      site.classList.add('visible');
    }, 950);
  }

  requestAnimationFrame(frame);
})();

/* =====================================================================
   ПОЛЕ КОДА: только цифры, форматирование группами по 5
   ===================================================================== */
const codeInput = document.getElementById('code-input');
const codeCounter = document.getElementById('code-counter');

function rawDigits(value){
  return value.replace(/\D/g, '').slice(0, CONFIG.CODE_LENGTH);
}

function formatCode(digits){
  return digits.replace(/(.{5})/g, '$1 ').trim();
}

codeInput.addEventListener('input', () => {
  const digits = rawDigits(codeInput.value);
  codeInput.value = formatCode(digits);
  codeCounter.textContent = digits.length + ' / ' + CONFIG.CODE_LENGTH;
  codeCounter.classList.toggle('full', digits.length === CONFIG.CODE_LENGTH);
});

/* =====================================================================
   ПОДСКАЗКА
   ===================================================================== */
let hintIndex = -1;
const hintBtn = document.getElementById('hint-btn');
const hintPanel = document.getElementById('hint-panel');

hintBtn.addEventListener('click', () => {
  if (!CONFIG.HINTS.length) return;
  hintIndex = (hintIndex + 1) % CONFIG.HINTS.length;
  hintPanel.textContent = CONFIG.HINTS[hintIndex];
  hintPanel.classList.add('shown');
  requestAnimationFrame(() => hintPanel.classList.add('visible'));
});

/* =====================================================================
   ОТПРАВКА В TELEGRAM
   ===================================================================== */
const form = document.getElementById('vault-form');
const submitBtn = document.getElementById('submit-btn');
const statusMsg = document.getElementById('status-msg');
const vault = document.getElementById('vault');

function setStatus(text, kind){
  statusMsg.textContent = text;
  statusMsg.className = 'status-msg' + (kind ? ' ' + kind : '');
}

function escapeHtml(str){
  return str.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('f-name').value.trim();
  const room = document.getElementById('f-room').value.trim();
  const digits = rawDigits(codeInput.value);

  if (!name || !room){
    setStatus('Заполните имя и аудиторию, прежде чем открыть сейф.', 'error');
    return;
  }
  if (digits.length !== CONFIG.CODE_LENGTH){
    setStatus('Код должен содержать ровно ' + CONFIG.CODE_LENGTH + ' цифр.', 'error');
    return;
  }

  submitBtn.disabled = true;
  setStatus('Передача данных в хранилище...', 'pending');

  const time = new Date().toLocaleString('ru-RU');
  const message =
    '🔐 <b>Новая попытка открыть сейф</b>\n' +
    '<b>Имя:</b> ' + escapeHtml(name) + '\n' +
    '<b>Аудитория:</b> ' + escapeHtml(room) + '\n' +
    '<b>Код:</b> <code>' + digits + '</code>\n' +
    '<b>Время:</b> ' + time;

  try {
    const res = await fetch('https://api.telegram.org/bot' + CONFIG.BOT_TOKEN + '/sendMessage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: CONFIG.CHAT_ID,
        text: message,
        parse_mode: 'HTML'
      })
    });

    const data = await res.json();

    if (data.ok){
      vault.classList.remove('spinning');
      vault.classList.add('unlocked');
      setStatus('Данные приняты. Сейф открыт.', 'ok');
      submitBtn.textContent = 'Сейф открыт';
    } else {
      setStatus('Хранилище отклонило запрос. Попробуйте ещё раз.', 'error');
      submitBtn.disabled = false;
    }
  } catch (err){
    setStatus('Не удалось связаться с хранилищем. Проверьте соединение и попробуйте снова.', 'error');
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
